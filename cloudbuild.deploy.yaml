steps:
  - name: gcr.io/cloud-builders/docker
    secretEnv:
      - NPM_TOKEN
    env:
      # Required for the Dockerfile's `# syntax=` frontend, `docker build
      # --secret`, and `--mount=type=secret`. The cloud-builders/docker image
      # does not enable BuildKit by default.
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --secret
      - id=npm_token,env=NPM_TOKEN
      - --build-arg
      - NEXT_PUBLIC_DEPLOY_CHANNEL=${_DEPLOY_CHANNEL}
      - --tag
      - ${_IMAGE}
      - .

# NEXT_PUBLIC_DEPLOY_CHANNEL is inlined into the client bundle at build time,
# so it is baked into the image here rather than only set at runtime. This
# makes images channel-specific: preview and production must not share a tag.
substitutions:
  _DEPLOY_CHANNEL: production

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/polyvise-packages-token/versions/latest
      env: NPM_TOKEN

images:
  - ${_IMAGE}
